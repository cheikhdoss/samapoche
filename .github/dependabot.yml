# Mises à jour de dépendances automatisées (GitHub Dependabot).
version: 2
updates:
  # Dépendances Dart/Flutter (pub.dev).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dart
    ignore:
      # build_runner 2.16+ exige analyzer >=13.3.0 -> meta ^1.18.3, or le SDK
      # Flutter 3.44.7 épingle meta 1.18.0 : résolution de version impossible.
      # À réévaluer quand le SDK Flutter sera monté.
      - dependency-name: "build_runner"
        versions: [">=2.16.0"]

  # Actions GitHub utilisées par les workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci