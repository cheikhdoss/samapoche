name: CI — Qualité, tests, sécurité et build
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  analyse:
    name: Analyse statique (flutter analyze + dart format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib test

  tests:
    name: Tests unitaires et widgets (couverture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  tests-integration:
    name: Tests d'intégration (parcours complets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - run: flutter pub get
      - name: Lancer chromedriver
        run: chromedriver --port=4444 &
      - name: Exécuter les parcours E2E
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --web-port=8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: captures-echec-e2e
          path: screenshots/

  build-android:
    name: Build Android signé (APK + AAB)
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Reconstruire le keystore
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/key.jks
      - name: Écrire les identifiants de signature
        if: ${{ env.KEYSTORE_PASSWORD != '' }}
        run: |
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/app-release.aab

  sonarqube:
    name: SAST SonarQube (porte de qualité ≥ 80 %)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobsf:
    name: SAST mobile MobSF (scan de l'APK)
    runs-on: ubuntu-latest
    needs: build-android
    env:
      MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
      - uses: MobSF/mobsf-scan-github-action@v2
        if: ${{ env.MOBSF_API_KEY != '' }}
        with:
          target: app-release.apk
          upload_sarif: true