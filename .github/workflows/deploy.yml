name: Déploiement — Terraform + Kubernetes
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Provisionnement automatique (Terraform)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialisation
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        working-directory: infra
        run: terraform init
      - name: Plan
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        working-directory: infra
        run: terraform plan -out=tfplan
      - name: Apply
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        working-directory: infra
        run: terraform apply -auto-approve tfplan

  deploy-k8s:
    name: Déploiement automatisé sur Kubernetes
    runs-on: ubuntu-latest
    needs: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Connexion au cluster EKS
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: aws eks update-kubeconfig --name samapoche-eks --region ${{ vars.AWS_REGION }}
      - name: Mise à jour de l'image
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: kubectl set image deployment/samapoche-web web=ghcr.io/cheikhdoss/samapoche:sha-${{ github.sha }} --record
      - name: Attente du déploiement (rollout)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: kubectl rollout status deployment/samapoche-web --timeout=5m
      - name: État des pods
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: kubectl get pods -l app=samapoche
