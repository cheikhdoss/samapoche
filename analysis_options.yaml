# Lints stricts pour un projet "senior" (Very Good Ventures).
# Quelques règles purement stylistiques sont désactivées pour coller
# au style historique du dépôt ; les règles substantielles restent actives.
include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  exclude:
    # Fichiers générés : ne pas les lint (json_serializable / gen-l10n).
    - 'lib/**/*.g.dart'
    - 'lib/l10n/app_localizations*.dart'
    - 'lib/l10n/**/app_localizations*.dart'

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    avoid_relative_lib_imports: false
    sort_constructors_first: false
    always_put_required_named_parameters_first: false
    eol_at_end_of_file: false
    unnecessary_breaks: false
    avoid_escaping_inner_quotes: false
    avoid_redundant_argument_values: false
    use_late_for_private_fields_and_variables: false