apiVersion: apps/v1
kind: Deployment
metadata:
  name: samapoche-web
  labels:
    app: samapoche
spec:
  replicas: 2
  selector:
    matchLabels:
      app: samapoche
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: samapoche
    spec:
      containers:
        - name: web
          image: ghcr.io/cheikhdoss/samapoche:main
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
