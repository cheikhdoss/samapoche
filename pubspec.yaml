name: samapoche
description: "SamaPoche — Gestion financière intelligente"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
